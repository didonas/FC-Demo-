<svg width="800" height="960" viewBox="0 0 800 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#E8E2D5" />
    </radialGradient>
    <linearGradient id="bodyG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FCFAF6" />
      <stop offset="100%" stopColor="#F2ECE0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#102738" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="800" height="960" rx="32" fill="url(#bgG)" />

  <g filter="url(#shadow)">
    <!-- Main Torso Silhouette -->
    <path d="M280 180 L230 200 L110 320 L180 430 L250 370 V790 C250 810 270 820 290 820 H510 C530 820 550 810 550 790 V370 L620 430 L690 320 L570 200 L520 180 Z" fill="url(#bodyG)" stroke="#D8CFBD" stroke-width="2" />

    <!-- Sleeve Cuffs -->
    <path d="M110 320 L135 348 L180 430 L155 402 Z" fill="#102738" />
    <path d="M135 348 L142 356 L162 410 L155 402 Z" fill="#B77A59" />
    <path d="M690 320 L665 348 L620 430 L645 402 Z" fill="#102738" />
    <path d="M665 348 L658 356 L638 410 L645 402 Z" fill="#B77A59" />

    <!-- Back Collar with Slogan -->
    <path d="M330 178 C330 200 470 200 470 178 Z" fill="#102738" />
    <text x="400" y="222" text-anchor="middle" fill="#B77A59" font-size="10" font-weight="800" font-family="sans-serif" letter-spacing="3">ONE STATE. ONE PASSION.</text>
    <polygon points="400,230 402,234 406,234 403,237 404,241 400,239 396,241 397,237 394,234 398,234" fill="#B77A59" />

    <!-- Player Name: VARADHAN -->
    <text x="400" y="340" text-anchor="middle" fill="#102738" font-size="44" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="8">VARADHAN</text>

    <!-- Big Player Number: 10 -->
    <g transform="translate(400, 520)">
      <text x="0" y="0" text-anchor="middle" fill="#102738" font-size="180" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="4">10</text>
      <!-- Copper drop-shadow outline inside number -->
      <text x="4" y="4" text-anchor="middle" fill="none" stroke="#B77A59" stroke-width="2" font-size="180" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="4" opacity="0.6">10</text>
      <!-- Mini Club Crest at base of number -->
      <circle cx="20" cy="20" r="12" fill="#B77A59" />
      <path d="M20 12 L28 16 V24 C28 29 20 32 20 32 C20 32 12 29 12 24 V16 Z" fill="#102738" />
    </g>

    <!-- Lower Back Sponsor: TAMIL TELECOM -->
    <g transform="translate(400, 740)">
      <text x="0" y="0" text-anchor="middle" fill="#102738" font-size="18" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="3">TAMIL TELECOM</text>
      <text x="0" y="16" text-anchor="middle" fill="#B77A59" font-size="9" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="4">5G ULTRA NETWORK</text>
    </g>
  </g>
</svg>