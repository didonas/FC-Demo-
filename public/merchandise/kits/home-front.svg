<svg width="800" height="960" viewBox="0 0 800 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#E8E2D5" />
    </radialGradient>
    <linearGradient id="bodyG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FCFAF6" />
      <stop offset="100%" stopColor="#F2ECE0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#102738" flood-opacity="0.14" />
    </filter>
    <pattern id="jacquard" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L20 0 L40 20 L20 40 Z" fill="none" stroke="#E2DAC9" stroke-width="1.2" opacity="0.4" />
      <path d="M10 20 L20 10 L30 20 L20 30 Z" fill="none" stroke="#B77A59" stroke-width="0.6" opacity="0.25" />
    </pattern>
  </defs>

  <rect width="800" height="960" rx="32" fill="url(#bgG)" />

  <g filter="url(#shadow)">
    <!-- Main Torso Silhouette -->
    <path d="M280 180 L230 200 L110 320 L180 430 L250 370 V790 C250 810 270 820 290 820 H510 C530 820 550 810 550 790 V370 L620 430 L690 320 L570 200 L520 180 Z" fill="url(#bodyG)" stroke="#D8CFBD" stroke-width="2" />

    <!-- Subtle Jacquard Overlay on Body -->
    <path d="M250 250 H550 V790 C550 810 530 820 510 820 H290 C270 820 250 810 250 790 Z" fill="url(#jacquard)" />

    <!-- Atlantic Navy Sleeve Cuffs with Copper Trim -->
    <path d="M110 320 L135 348 L180 430 L155 402 Z" fill="#102738" />
    <path d="M135 348 L142 356 L162 410 L155 402 Z" fill="#B77A59" />
    <path d="M690 320 L665 348 L620 430 L645 402 Z" fill="#102738" />
    <path d="M665 348 L658 356 L638 410 L645 402 Z" fill="#B77A59" />

    <!-- Ribbed Atlantic Navy Crew Collar with Copper Piping -->
    <path d="M330 178 C330 230 470 230 470 178 C450 170 350 170 330 178 Z" fill="#102738" />
    <path d="M340 180 C340 220 460 220 460 180 C445 174 355 174 340 180 Z" fill="#F4F1E9" />
    <path d="M342 195 C360 215 440 215 458 195" stroke="#B77A59" stroke-width="2.5" fill="none" />

    <!-- Shoulder Contour Seams in Navy & Copper -->
    <path d="M280 180 L250 370" stroke="#102738" stroke-width="2" opacity="0.25" />
    <path d="M520 180 L550 370" stroke="#102738" stroke-width="2" opacity="0.25" />
    <path d="M250 420 V790" stroke="#B77A59" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 2" />
    <path d="M550 420 V790" stroke="#B77A59" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 2" />

    <!-- Official Club Crest on Left Chest -->
    
  <g transform="translate(450, 270) scale(1.2)">
    <polygon points="25,2 26.5,5.5 30,5.7 27.5,7.8 28.3,11 25,9.2 21.7,11 22.5,7.8 20,5.7 23.5,5.5" fill="#B77A59" />
    <path d="M25 9 L46 16 V38 C46 54 25 70 25 70 C25 70 4 54 4 38 V16 L25 9 Z" fill="#102738" stroke="#B77A59" stroke-width="1.8"/>
    <path d="M7 19 L25 13 L43 19 V27 L25 23 L7 27 V19 Z" fill="#B77A59"/>
    <text x="25" y="22" text-anchor="middle" fill="#F4F1E9" font-size="4.2" font-weight="900" font-family="sans-serif" letter-spacing="0.6">TAMILNADU</text>
    <path d="M25 28 L31 41 H19 L25 28 Z" fill="#F4F1E9"/>
    <circle cx="25" cy="27" r="1.3" fill="#B77A59"/>
    <rect x="17" y="56" width="16" height="8" rx="2" fill="#0A1824" stroke="#B77A59" stroke-width="0.8"/>
    <text x="25" y="62" text-anchor="middle" fill="#F4F1E9" font-size="5" font-weight="800" font-family="sans-serif">FC</text>
  </g>
  

    <!-- Maker Logo on Right Chest -->
    <g transform="translate(290, 290)">
      <path d="M0 20 L16 0 L32 20 H24 L16 10 L8 20 Z" fill="#102738" />
      <polygon points="16,3 18,7 23,7 19,10 20,14 16,12 12,14 13,10 9,7 14,7" fill="#B77A59" />
    </g>

    <!-- Center Chest Sponsor: BAY MARINE -->
    <g transform="translate(400, 480)">
      <text x="0" y="0" text-anchor="middle" fill="#102738" font-size="34" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="4">BAY MARINE</text>
      <text x="0" y="24" text-anchor="middle" fill="#B77A59" font-size="11" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="6">LOGISTICS • PORTS • GLOBAL</text>
      <line x1="-120" y1="-14" x2="120" y2="-14" stroke="#B77A59" stroke-width="1.5" opacity="0.5" />
    </g>

    <!-- Lower Hem Authentic Tag -->
    <rect x="270" y="755" width="46" height="30" rx="3" fill="#102738" stroke="#B77A59" stroke-width="1" />
    <text x="293" y="768" text-anchor="middle" fill="#F4F1E9" font-size="6" font-weight="900" font-family="sans-serif">OFFICIAL</text>
    <text x="293" y="777" text-anchor="middle" fill="#B77A59" font-size="5" font-weight="700" font-family="sans-serif">MATCH ISSUE</text>
  </g>
</svg>