    <path d="M70 280 C140 220 260 220 330 280" stroke="#5A2E12" stroke-width="4" fill="none" />
    <path d="M200 10 V390" stroke="#5A2E12" stroke-width="4" />
    <path d="M120 70 V330" stroke="#5A2E12" stroke-width="3" />
    <path d="M280 70 V330" stroke="#5A2E12" stroke-width="3" />
    <!-- Stitched Leather Lacing in Center -->
    <rect x="175" y="160" width="50" height="80" rx="4" fill="#8C4D22" stroke="#5A2E12" stroke-width="2" />
    <line x1="180" y1="170" x2="220" y2="170" stroke="#F4F1E9" stroke-width="3.5" stroke-linecap="round" /><line x1="180" y1="181" x2="220" y2="181" stroke="#F4F1E9" stroke-width="3.5" stroke-linecap="round" /><line x1="180" y1="192" x2="220" y2="192" stroke="#F4F1E9" stroke-width="3.5" stroke-linecap="round" /><line x1="180" y1="203" x2="220" y2="203" stroke="#F4F1E9" stroke-width="3.5" stroke-linecap="round" /><line x1="180" y1="214" x2="220" y2="214" stroke="#F4F1E9" stroke-width="3.5" stroke-linecap="round" /><line x1="180" y1="225" x2="220" y2="225" stroke="#F4F1E9" stroke-width="3.5" stroke-linecap="round" />
    <!-- Debossed 1934 Founding Seal -->
